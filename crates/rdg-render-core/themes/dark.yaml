# rdg built-in theme: dark — the light theme's meanings on a midnight canvas.
extends: light
name: dark
mode: dark
canvas: {background: "#020617", grid: "#1e293b"}
text: {primary: "#f8fafc", muted: "#94a3b8", dim: "#475569"}
title: {color: "#f8fafc", description_color: "#94a3b8"}
node: {detail_color: "#94a3b8"}
group: {fill_opacity: 0.07}
edge: {color: "#64748b"}
edge_label: {color: "#94a3b8", background: "#020617"}
badge: {fill: "#f8fafc", text: "#020617"}
icon: {mono_color: "#f8fafc", backdrop: "#e2e8f0"}
categories:
  frontend:   {fill: "#1e3a8a66", stroke: "#60a5fa"}
  backend:    {fill: "#064e3b66", stroke: "#34d399"}
  database:   {fill: "#4c1d9566", stroke: "#a78bfa"}
  messagebus: {fill: "#7c2d124d", stroke: "#fb923c"}
  cloud:      {fill: "#164e634d", stroke: "#22d3ee"}
  security:   {fill: "#7f1d1d66", stroke: "#f87171"}
  external:   {fill: "#1e293b80", stroke: "#94a3b8"}
  neutral:    {fill: "#0f172a", stroke: "#475569"}
edge_styles:
  reply:  {color: "#475569"}
  return: {color: "#475569"}
sequence:
  lifeline: {color: "#475569"}
  activation: {fill: "#0f172a", stroke: "#64748b"}
  note: {fill: "#3f3a1c", stroke: "#a3872f", text: "#fde68a"}
  fragment: {stroke: "#64748b", tab_fill: "#1e293b", tab_text: "#f8fafc", guard_color: "#94a3b8"}
  divider: {color: "#334155"}
