diagram_type: flowchart
theme: standard
title: "High-Level System Design"
description: "AI Semantic Generation to Deterministic Graph Compilation"
spacing:
  rank: 52
  node: 36
  group_gap_x: 64.0
  group_gap_y: 64.0
groups:
  - id: grp_client
    label: "Client / Prompt Layer"
    color: "#64748b"
    nodes: ["llm", "yaml"]
  - id: grp_compiler
    label: "rdg Compilation Pipeline"
    color: "#2563eb"
    nodes: ["rdg", "schema", "graph", "layout", "renderer"]
  - id: grp_output
    label: "Artifacts"
    color: "#059669"
    nodes: ["drawio", "svg"]
nodes:
  - id: llm
    label: "LLM / AI Agent"
    type: client
    metadata: "Generates the semantic graph as token-efficient YAML. Never computes coordinates."
  - id: yaml
    label: "YAML Payload\n(Token-Minimal)"
    type: queue
    metadata: "Token-optimised flat schema: diagram_type, nodes[], edges[]"
  - id: rdg
    label: "`rdg` CLI\n(Compiler)"
    type: proxy
    language: rust
    technology: "Rust 1.85+"
    metadata: "rdg --input diagram.yaml --output out.drawio"
  - id: schema
    label: "Schema Parser\n(`serde_yaml`)"
    type: server
    language: rust
    technology: "serde_yaml"
    metadata: "serde_yaml → DiagramPayload struct"
  - id: graph
    label: "Graph Builder\n(`petgraph` + FAS)"
    type: server
    language: rust
    technology: "petgraph"
    metadata: "petgraph StableDiGraph + ELS FAS cycle breaker"
  - id: layout
    label: "Layout Engine\n(2D Grid Search)"
    type: server
    language: rust
    technology: "Sugiyama DAG"
    metadata: "Sugiyama framework + Crossing Minimisation"
  - id: renderer
    label: "Renderer Core\n(draw.io + SVG)"
    type: server
    language: rust
    technology: "quick-xml + svg"
    metadata: "draw.io mxfile writer or native SVG writer"
  - id: drawio
    label: "`output.drawio`\n(draw.io XML)"
    type: database
    metadata: "Strict uncompressed mxfile format. Open in draw.io / diagrams.net"
  - id: svg
    label: "`output.svg`\n(SVG Graphics)"
    type: database
    metadata: "Embeddable in Markdown, HTML, docs"
edges:
  - from: llm
    to: yaml
    label: "emits"
    edge_style: async
  - from: yaml
    to: rdg
    label: "stdin / --input"
    edge_style: flow
  - from: rdg
    to: schema
    label: "parse"
    edge_style: flow
  - from: schema
    to: graph
    label: "DiagramPayload"
    edge_style: data
  - from: graph
    to: layout
    label: "CompiledGraph"
    edge_style: data
  - from: layout
    to: renderer
    label: "LayoutResult"
    edge_style: data
  - from: renderer
    to: drawio
    label: ".drawio"
    edge_style: flow
    source_port: bottom
    target_port: top
  - from: renderer
    to: svg
    label: ".svg"
    edge_style: flow
    source_port: bottom
    target_port: top
