diagram_type: flowchart
theme: standard
groups:
  - id: grp_client
    label: "Client / Prompt Layer"
    color: "#64748b"
    nodes: ["llm", "yaml"]
  - id: grp_compiler
    label: "rdg Compilation Pipeline"
    color: "#2563eb"
    nodes: ["rdg", "schema", "graph", "layout", "renderer"]
  - id: grp_output
    label: "Artifacts"
    color: "#059669"
    nodes: ["drawio", "svg"]
nodes:
  - id: llm
    label: "LLM / AI Agent"
    type: client
    metadata: "Generates the semantic graph as token-efficient YAML. Never computes coordinates."
  - id: yaml
    label: "YAML Payload"
    type: queue
    metadata: "Token-optimised flat schema: diagram_type, nodes[], edges[]"
  - id: rdg
    label: "rdg CLI"
    type: proxy
    metadata: "rdg --input diagram.yaml --output out.drawio"
  - id: schema
    label: "Schema Parser"
    type: server
    metadata: "serde_yaml → DiagramPayload struct"
  - id: graph
    label: "Graph Builder"
    type: server
    metadata: "petgraph StableDiGraph + ELS FAS cycle breaker"
  - id: layout
    label: "Layout Engine"
    type: server
    metadata: "Sugiyama framework + Crossing Minimisation"
  - id: renderer
    label: "Renderer"
    type: server
    metadata: "quick-xml mxfile writer or SVG writer"
  - id: drawio
    label: "draw.io XML\n(.drawio)"
    type: database
    metadata: "Strict uncompressed mxfile format. Open in draw.io / diagrams.net"
  - id: svg
    label: "SVG File\n(.svg)"
    type: database
    metadata: "Embeddable in Markdown, HTML, docs"
edges:
  - from: llm
    to: yaml
    label: "emits"
    edge_style: async
  - from: yaml
    to: rdg
    label: "stdin / --input"
    edge_style: flow
  - from: rdg
    to: schema
    label: "parse"
    edge_style: flow
  - from: schema
    to: graph
    label: "DiagramPayload"
    edge_style: data
  - from: graph
    to: layout
    label: "CompiledGraph"
    edge_style: data
  - from: layout
    to: renderer
    label: "LayoutResult"
    edge_style: data
  - from: renderer
    to: drawio
    label: ".drawio"
    edge_style: flow
  - from: renderer
    to: svg
    label: ".svg"
    edge_style: flow
