diagram_type: flowchart
theme: standard
title: "Low-Level Design Architecture"
description: "Deterministic Compilation Pipeline (Ingestion → Schema → IR → Layout → Render)"
groups:
  - id: grp_cli
    label: "CLI & Ingestion"
    color: "#64748b"
    nodes: ["cli_args", "stdin_file"]
  - id: grp_schema
    label: "Schema Layer"
    color: "#0284c7"
    nodes: ["diagram_payload", "node_def", "edge_def"]
  - id: grp_graph
    label: "Graph IR Layer"
    color: "#059669"
    nodes: ["stable_graph", "node_data", "edge_data", "fas", "compiled_graph"]
  - id: grp_layout
    label: "Layout Engine"
    color: "#d97706"
    nodes: ["layout_config", "visual_graph", "topo_fallback", "layout_result"]
  - id: grp_render
    label: "Rendering Layer"
    color: "#7c3aed"
    nodes: ["style_fn", "xml_writer", "svg_writer", "drawio_out", "svg_out"]
nodes:
  - id: cli_args
    label: "`clap::Cli`\n(CLI Arguments)"
    type: proxy
    metadata: "--input, --output, --layout, --theme, --rank-spacing, --node-spacing"
  - id: stdin_file
    label: "stdin / File\n(YAML Source)"
    type: queue
    metadata: "Read via std::io::stdin or std::fs::read_to_string"
  - id: diagram_payload
    label: "`schema::`\n`DiagramPayload`"
    type: server
    metadata: "serde_yaml::from_str → DiagramPayload { diagram_type, theme, nodes: Vec<NodeDef>, edges: Vec<EdgeDef> }"
  - id: node_def
    label: "`schema::NodeDef`\n{ id, label, type, meta }"
    type: server
    metadata: "node_type renamed from 'type' via #[serde(rename)]"
  - id: edge_def
    label: "`schema::EdgeDef`\n{ from, to, label }"
    type: server
    metadata: "Directed edge between two node IDs"
  - id: stable_graph
    label: "`petgraph::`\n`StableDiGraph`"
    type: database
    metadata: "StableDiGraph<NodeData, EdgeData> — stable indices survive dummy-node insertion"
  - id: node_data
    label: "`graph::NodeData`\n{ id, label, type, meta }"
    type: server
    metadata: "Stored at each graph node index"
  - id: edge_data
    label: "`graph::EdgeData`\n{ label, reversed }"
    type: server
    metadata: "reversed=true when edge was flipped by FAS"
  - id: fas
    label: "FAS Cycle Breaker\n(DFS Back-edge Reversal)"
    type: decision
    metadata: "Greedy Feedback Arc Set: reverses back-edges found in DFS traversal to make graph acyclic"
  - id: compiled_graph
    label: "`graph::`\n`CompiledGraph`"
    type: database
    metadata: "{ graph: StableDiGraph, node_map: HashMap<String,NodeIndex>, had_cycles: bool }"
  - id: layout_config
    label: "`layout::LayoutConfig`\n{ rank_spacing, node_spacing }"
    type: server
    metadata: "Driven by --rank-spacing and --node-spacing CLI flags"
  - id: visual_graph
    label: "`layout-rs`\n`VisualGraph`\n(Sugiyama Engine)"
    type: server
    metadata: "layout::topo::layout::VisualGraph — runs hierarchical Sugiyama layout algorithm"
  - id: topo_fallback
    label: "Topo-sort Fallback\n(Longest-path Ranking)"
    type: decision
    metadata: "Pure-Rust fallback: petgraph::algo::toposort + longest-path layer assignment"
  - id: layout_result
    label: "`layout::LayoutResult`\n{ positions: HashMap }"
    type: database
    metadata: "NodeLayout { x, y, width, height } for every node"
  - id: style_fn
    label: "`render::style_for_type`\n(Type → Style String)"
    type: server
    metadata: "Maps proxy/database/server/queue/cache/function/client/decision → mxCell style attr"
  - id: xml_writer
    label: "`quick-xml` Writer\n(draw.io XML)"
    type: server
    metadata: "Writes <?xml><mxfile><diagram><mxGraphModel><root> with mandatory id=0, id=1 stubs"
  - id: svg_writer
    label: "`quick-xml` Writer\n(SVG Graphics)"
    type: server
    metadata: "Writes <svg> with <rect> nodes, <line> edges, <text> labels"
  - id: drawio_out
    label: "`output.drawio`\n(mxfile XML)"
    type: database
    metadata: "Uncompressed. Open in draw.io desktop or diagrams.net"
  - id: svg_out
    label: "`output.svg`\n(SVG Graphics)"
    type: database
    metadata: "Embed in Markdown, HTML, Notion, Confluence"
edges:
  - from: cli_args
    to: stdin_file
    label: "--input / stdin"
  - from: stdin_file
    to: diagram_payload
    label: "serde_yaml::from_str"
  - from: diagram_payload
    to: node_def
    label: "nodes[]"
  - from: diagram_payload
    to: edge_def
    label: "edges[]"
  - from: node_def
    to: stable_graph
    label: "add_node → NodeData"
  - from: edge_def
    to: stable_graph
    label: "add_edge → EdgeData"
  - from: stable_graph
    to: node_data
    label: "stores"
  - from: stable_graph
    to: edge_data
    label: "stores"
  - from: stable_graph
    to: fas
    label: "is_cyclic_directed?"
  - from: fas
    to: compiled_graph
    label: "acyclic graph"
  - from: cli_args
    to: layout_config
    label: "--rank-spacing / --node-spacing"
  - from: compiled_graph
    to: visual_graph
    label: "add nodes + edges"
  - from: layout_config
    to: visual_graph
    label: "node size / spacing"
  - from: visual_graph
    to: topo_fallback
    label: "on error"
  - from: visual_graph
    to: layout_result
    label: "vg.pos(handle).bbox()"
  - from: topo_fallback
    to: layout_result
    label: "layer × spacing"
  - from: compiled_graph
    to: style_fn
    label: "node_type"
  - from: style_fn
    to: xml_writer
    label: "style string"
  - from: layout_result
    to: xml_writer
    label: "x, y, w, h"
  - from: layout_result
    to: svg_writer
    label: "x, y, w, h"
  - from: compiled_graph
    to: xml_writer
    label: "node/edge data"
  - from: compiled_graph
    to: svg_writer
    label: "node/edge data"
  - from: xml_writer
    to: drawio_out
    label: "write"
  - from: svg_writer
    to: svg_out
    label: "write"
