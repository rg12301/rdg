diagram_type: flowchart
theme: standard
title: "Low-Level Design Architecture"
description: "Deterministic Compilation Pipeline (Ingestion → Schema → IR → Layout → Core → Render)"
spacing:
  rank: 48
  node: 36
  group_gap_x: 64.0
  group_gap_y: 64.0
groups:
  - id: grp_cli
    label: "crates/rdg-cli (CLI & Ingestion)"
    nodes: ["cli_args", "input_loader"]
  - id: grp_schema
    label: "crates/rdg-schema (Schema & Presets)"
    nodes: ["payload_parser", "style_presets"]
  - id: grp_graph
    label: "crates/rdg-graph (Graph IR & Cycle Breaking)"
    nodes: ["graph_builder", "fas_breaker"]
  - id: grp_layout
    label: "crates/rdg-layout (Hierarchical Layout Engine)"
    nodes: ["sugiyama", "compound_grid", "straightening"]
  - id: grp_core
    label: "crates/rdg-render-core & rdg-icons (Routing & Style)"
    nodes: ["icon_engine", "routing_engine", "review_loop"]
  - id: grp_drawio
    label: "crates/rdg-render-drawio"
    nodes: ["drawio_backend", "out_drawio"]
  - id: grp_svg
    label: "crates/rdg-render-svg"
    nodes: ["svg_backend", "out_svg"]
nodes:
  - id: cli_args
    label: "`clap::Cli`\n(CLI Arguments)"
    type: proxy
    language: rust
    technology: "clap 4.6"
    metadata: "--input, --output, --layout, --theme, --direction, --strict, --svg-engine"

  - id: input_loader
    label: "Input Ingestion\n(stdin / File)"
    type: queue
    language: rust
    technology: "std::io"
    metadata: "Reads YAML payload from stdin or file path"

  - id: payload_parser
    label: "`DiagramPayload`\n(Schema Validator)"
    type: server
    language: rust
    technology: "serde_yaml 0.9"
    metadata: "Deserializes YAML into typed DiagramPayload with validation"

  - id: style_presets
    label: "Preset Resolver\n(`node_styles` /\n`edge_styles`)"
    type: server
    language: rust
    technology: "HashMap"
    metadata: "Fills styling gaps from class presets into NodeDef and EdgeDef"

  - id: graph_builder
    label: "Graph Builder\n(`StableDiGraph`)"
    type: server
    language: rust
    technology: "petgraph 0.6"
    metadata: "Constructs StableDiGraph<NodeData, EdgeData> preserving node mappings"

  - id: fas_breaker
    label: "FAS Cycle Breaker\n(DFS Back-edge Reversal)"
    type: decision
    language: rust
    technology: "ELS Greedy FAS"
    metadata: "Detects cycles and reverses back-edges to produce an acyclic DAG"

  - id: sugiyama
    label: "Sugiyama Hierarchy\n(Ranking & Crossing Min)"
    type: server
    language: rust
    technology: "Barycentric Median"
    metadata: "Longest-path topological ranking + 3-pass alternating barycentric crossing minimization"

  - id: compound_grid
    label: "Compound Placer\n(2D Group Quotient Grid)"
    type: server
    language: rust
    technology: "Grid Search"
    metadata: "Optimizes container layout to achieve a squarish aspect ratio close to 1.0"

  - id: straightening
    label: "Chain Straightener\n(Alignment & Centering)"
    type: server
    language: rust
    technology: "Rank Balancing"
    metadata: "Aligns straight chains and centers sibling nodes within each rank"

  - id: icon_engine
    label: "Brand Icon Badges\n(Simple Icons &\nEngine Detection)"
    type: server
    language: rust
    technology: "60+ SVG Icons"
    metadata: "Vendored Simple Icons SVGs and heuristic language/database detection"

  - id: routing_engine
    label: "Obstacle Router\n(Orthogonal Waypoints)"
    type: server
    language: rust
    technology: "AABB Bypass"
    metadata: "Shortest-distance face selection, 24px clearance stubs, obstacle avoidance"

  - id: review_loop
    label: "Self-Review Validator\n(Geometry Linter & Retry)"
    type: decision
    language: rust
    technology: "Auto-Retry Loop"
    metadata: "Checks for node overlaps, edges through nodes, and retries with wider spacing"

  - id: drawio_backend
    label: "draw.io XML Backend\n(`quick-xml` mxfile)"
    type: server
    language: rust
    technology: "quick-xml 0.36"
    metadata: "Strict uncompressed mxfile format, HTML labels, jumpStyle=arc"

  - id: out_drawio
    label: "`output.drawio`\n(draw.io XML)"
    type: database
    metadata: "Uncompressed mxfile. Open in draw.io desktop or diagrams.net"

  - id: svg_backend
    label: "SVG Backend\n(Native + Headless CLI)"
    type: server
    language: rust
    technology: "svg 0.17 + drawio"
    metadata: "Elevated drop-shadow cards, rounded fillet paths, exact drawio export"

  - id: out_svg
    label: "`output.svg`\n(SVG Graphics)"
    type: database
    metadata: "Embeddable in Markdown, HTML, Notion, Confluence"

edges:
  - from: cli_args
    to: input_loader
    label: "args"
    edge_style: flow

  - from: input_loader
    to: payload_parser
    label: "raw YAML"
    edge_style: flow

  - from: payload_parser
    to: style_presets
    label: "classes"
    edge_style: data

  - from: style_presets
    to: graph_builder
    label: "NodeDef / EdgeDef"
    edge_style: data

  - from: graph_builder
    to: fas_breaker
    label: "is_cyclic_directed?"
    edge_style: flow

  - from: fas_breaker
    to: sugiyama
    label: "acyclic CompiledGraph"
    edge_style: data

  - from: sugiyama
    to: compound_grid
    label: "ranked ranks"
    edge_style: data

  - from: compound_grid
    to: straightening
    label: "2D grid"
    edge_style: data

  - from: straightening
    to: routing_engine
    label: "NodeLayout"
    edge_style: data

  - from: icon_engine
    to: routing_engine
    label: "icon badges"
    edge_style: data

  - from: routing_engine
    to: review_loop
    label: "EdgeRoutingPlan"
    edge_style: flow

  - from: review_loop
    to: drawio_backend
    label: "pass: clean"
    edge_style: flow
    source_port: bottom
    target_port: top

  - from: review_loop
    to: svg_backend
    label: "pass: clean"
    edge_style: flow
    source_port: bottom
    target_port: top

  - from: drawio_backend
    to: out_drawio
    label: "write XML"
    edge_style: flow
    source_port: bottom
    target_port: top

  - from: svg_backend
    to: out_svg
    label: "write SVG"
    edge_style: flow
    source_port: bottom
    target_port: top
