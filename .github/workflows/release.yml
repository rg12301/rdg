name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: rdg
            asset_name: rdg-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rdg
            asset_name: rdg-macos-aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rdg
            asset_name: rdg-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: rdg
            asset_name: rdg-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rdg.exe
            asset_name: rdg-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows' && matrix.target != 'aarch64-unknown-linux-gnu'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare artifacts
        run: |
          mkdir -p release-artifacts
          for dir in artifacts/*/; do
            dir_name=$(basename "$dir")
            for file in "$dir"*; do
              filename=$(basename "$file")
              if [ "$filename" = "rdg" ] || [ "$filename" = "rdg.exe" ]; then
                cp "$file" "release-artifacts/${dir_name}-${filename}"
              fi
            done
          done
          ls -la release-artifacts/

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            release-artifacts/* \
            --title "${{ github.ref_name }}" \
            --generate-notes

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish rdg-cli to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --package rdg-cli

      - name: Publish other crates to crates.io
        run: |
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --package rdg-schema || true
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --package rdg-graph || true
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --package rdg-dispatch || true
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --package rdg-layout || true
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --package rdg-icons || true
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --package rdg-render-core || true
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --package rdg-render-drawio || true
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --package rdg-render-svg || true
