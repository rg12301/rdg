[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
authors = ["rdg contributors"]
rust-version = "1.85"

[workspace.dependencies]
rdg-schema = { path = "crates/rdg-schema" }
rdg-graph = { path = "crates/rdg-graph" }
rdg-dispatch = { path = "crates/rdg-dispatch" }
rdg-layout = { path = "crates/rdg-layout" }
rdg-icons = { path = "crates/rdg-icons" }
rdg-render-core = { path = "crates/rdg-render-core" }
rdg-render-drawio = { path = "crates/rdg-render-drawio" }
rdg-render-svg = { path = "crates/rdg-render-svg" }

clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
petgraph = "0.6"
quick-xml = "0.36"
anyhow = "1"
base64 = "0.22"
nalgebra = "0.33"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
