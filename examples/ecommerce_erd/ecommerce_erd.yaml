diagram_type: erd
theme: standard
title: "E-Commerce Order Schema"
nodes:
  - id: users
    label: "users"
    type: table
    fields:
      - "id: UUID [PK]"
      - "email: TEXT"
      - "created_at: TIMESTAMP"
  - id: addresses
    label: "addresses"
    type: table
    fields:
      - "id: UUID [PK]"
      - "user_id: UUID [FK]"
      - "line1: TEXT"
      - "city: TEXT"
  - id: orders
    label: "orders"
    type: table
    fields:
      - "id: UUID [PK]"
      - "user_id: UUID [FK]"
      - "address_id: UUID [FK]"
      - "status: TEXT"
      - "total: DECIMAL"
  - id: order_items
    label: "order_items"
    type: table
    fields:
      - "id: UUID [PK]"
      - "order_id: UUID [FK]"
      - "product_id: UUID [FK]"
      - "quantity: INT"
      - "unit_price: DECIMAL"
  - id: products
    label: "products"
    type: table
    fields:
      - "id: UUID [PK]"
      - "sku: TEXT"
      - "name: TEXT"
      - "price: DECIMAL"
  - id: categories
    label: "categories"
    type: table
    fields:
      - "id: UUID [PK]"
      - "name: TEXT"
  - id: payments
    label: "payments"
    type: table
    fields:
      - "id: UUID [PK]"
      - "order_id: UUID [FK]"
      - "amount: DECIMAL"
      - "method: TEXT"
edges:
  - from: users
    to: addresses
    label: "has"
    edge_style: one_to_many
  - from: users
    to: orders
    label: "places"
    edge_style: one_to_many
  - from: addresses
    to: orders
    label: "ships to"
    edge_style: one_to_many
  - from: orders
    to: order_items
    label: "contains"
    edge_style: one_to_many
  - from: products
    to: order_items
    label: "appears in"
    edge_style: one_to_many
  - from: categories
    to: products
    label: "classifies"
    edge_style: one_to_many
  - from: orders
    to: payments
    label: "settled by"
    edge_style: one_to_one
