# Ride-hailing platform — a large event-driven HLD: four client types, an edge tier,
# three service domains with nested sub-domains, streaming, ML, data stores,
# observability and third parties. Stress test for routing through many containers.
title: "Ride-hailing platform"
description: "Clients, edge, trip and payments domains, streaming, ML serving, storage"
direction: tb
groups:
  - {id: clients, label: "Clients", nodes: [rider_app, driver_app, web, partner_api]}
  - {id: edge, label: "Edge & API", nodes: [cdn, waf, gateway, idp]}
  - {id: core, label: "Core platform services", nodes: [trip_domain, marketplace, growth]}
  - {id: trip_domain, label: "Trip domain", nodes: [trip_svc, matching, eta, dispatch]}
  - {id: marketplace, label: "Marketplace & money", nodes: [pricing, surge, payments, wallet, invoicing]}
  - {id: growth, label: "Growth & comms", nodes: [promo, notifications, rating]}
  - {id: streaming, label: "Streaming backbone", nodes: [location_topic, trip_events, flink]}
  - {id: ml, label: "ML platform", nodes: [feature_store, eta_model, fraud_model]}
  - {id: stores, label: "Data stores", nodes: [trips_db, users_db, ledger_db, geo_index, cache, lake]}
  - {id: observability, label: "Observability", nodes: [otel, prometheus, grafana]}
  - {id: third, label: "Third parties", nodes: [maps_api, stripe, twilio]}
